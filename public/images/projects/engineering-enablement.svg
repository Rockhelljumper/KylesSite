<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Engineering enablement feedback loop</title>
  <desc id="desc">A connected flow shows delivery, observable operations, support feedback, and prioritization for continuous improvement.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112430"/><stop offset="1" stop-color="#1e3643"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#55c7d5"/><stop offset="1" stop-color="#f4bf73"/></linearGradient></defs>
  <rect width="1200" height="750" fill="url(#bg)"/><path d="M90 505 C280 300 360 575 555 375 S840 190 1110 340" fill="none" stroke="#315968" stroke-width="90" opacity=".35"/><path d="M90 505 C280 300 360 575 555 375 S840 190 1110 340" fill="none" stroke="url(#a)" stroke-width="6" stroke-linecap="round"/>
  <text x="75" y="102" fill="#8dd8c5" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4">ENGINEERING ENABLEMENT</text><text x="75" y="145" fill="#f3f5ef" font-family="Georgia, serif" font-size="42">Make the system easier to work in.</text>
  <g font-family="Arial, sans-serif"><g transform="translate(80 410)"><rect width="230" height="175" rx="17" fill="#173746" stroke="#54c6d5"/><text x="25" y="48" fill="#55c7d5" font-size="16" font-weight="700" letter-spacing="2">01 / DELIVERY</text><text x="25" y="92" fill="#f3f5ef" font-size="27" font-weight="700">Build &amp; release</text><text x="25" y="128" fill="#bfd0d4" font-size="17">Repeatable paths</text></g><g transform="translate(350 255)"><rect width="230" height="175" rx="17" fill="#173746" stroke="#54c6d5"/><text x="25" y="48" fill="#55c7d5" font-size="16" font-weight="700" letter-spacing="2">02 / SIGNALS</text><text x="25" y="92" fill="#f3f5ef" font-size="27" font-weight="700">See the work</text><text x="25" y="128" fill="#bfd0d4" font-size="17">Operational context</text></g><g transform="translate(620 380)"><rect width="230" height="175" rx="17" fill="#173746" stroke="#f4bf73"/><text x="25" y="48" fill="#f4bf73" font-size="16" font-weight="700" letter-spacing="2">03 / SUPPORT</text><text x="25" y="92" fill="#f3f5ef" font-size="27" font-weight="700">Reduce friction</text><text x="25" y="128" fill="#bfd0d4" font-size="17">Useful handoffs</text></g><g transform="translate(890 215)"><rect width="230" height="175" rx="17" fill="#173746" stroke="#8dd8c5"/><text x="25" y="48" fill="#8dd8c5" font-size="16" font-weight="700" letter-spacing="2">04 / IMPROVE</text><text x="25" y="92" fill="#f3f5ef" font-size="27" font-weight="700">Prioritize together</text><text x="25" y="128" fill="#bfd0d4" font-size="17">Remove root causes</text></g></g>
  <g fill="#f4bf73"><circle cx="195" cy="498" r="9"/><circle cx="465" cy="343" r="9"/><circle cx="735" cy="468" r="9"/><circle cx="1005" cy="303" r="9"/></g><text x="75" y="690" fill="#aebfc5" font-family="Arial, sans-serif" font-size="17">Sanitized portfolio model — a reusable operating pattern, not a private workflow diagram.</text>
</svg>
