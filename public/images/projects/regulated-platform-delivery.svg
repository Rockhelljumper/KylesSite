<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Regulated platform delivery model</title>
  <desc id="desc">A visual model showing engineering delivery, runtime platforms, partner boundaries, and measured operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102332"/><stop offset="1" stop-color="#172d3b"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#54c6d5"/><stop offset="1" stop-color="#8dd8c5"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1070" cy="82" r="180" fill="#1c4655" opacity=".45"/><circle cx="70" cy="700" r="250" fill="#183c4b" opacity=".36"/>
  <text x="75" y="102" fill="#8dd8c5" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4">REGULATED PLATFORM DELIVERY</text>
  <text x="75" y="145" fill="#f3f5ef" font-family="Georgia, serif" font-size="42">A repeatable path for change and care.</text>
  <path d="M210 390H1000" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <path d="M380 390l-25-16v32zM620 390l-25-16v32zM860 390l-25-16v32z" fill="#8dd8c5"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 275)"><rect width="240" height="230" rx="18" fill="#173746" stroke="#54c6d5"/><text x="28" y="55" fill="#54c6d5" font-size="17" font-weight="700" letter-spacing="2">01 / DELIVERY</text><text x="28" y="105" fill="#f3f5ef" font-size="29" font-weight="700">Build &amp; release</text><text x="28" y="145" fill="#bfced2" font-size="18">Repeatable paths</text><text x="28" y="174" fill="#bfced2" font-size="18">Clear ownership</text></g>
    <g transform="translate(330 275)"><rect width="240" height="230" rx="18" fill="#173746" stroke="#54c6d5"/><text x="28" y="55" fill="#54c6d5" font-size="17" font-weight="700" letter-spacing="2">02 / RUNTIME</text><text x="28" y="105" fill="#f3f5ef" font-size="29" font-weight="700">Operate reliably</text><text x="28" y="145" fill="#bfced2" font-size="18">Controlled change</text><text x="28" y="174" fill="#bfced2" font-size="18">Service signals</text></g>
    <g transform="translate(590 275)"><rect width="240" height="230" rx="18" fill="#173746" stroke="#54c6d5"/><text x="28" y="55" fill="#54c6d5" font-size="17" font-weight="700" letter-spacing="2">03 / PARTNERS</text><text x="28" y="105" fill="#f3f5ef" font-size="29" font-weight="700">Manage boundaries</text><text x="28" y="145" fill="#bfced2" font-size="18">Secure integration</text><text x="28" y="174" fill="#bfced2" font-size="18">Deliberate change</text></g>
    <g transform="translate(850 275)"><rect width="280" height="230" rx="18" fill="#173746" stroke="#54c6d5"/><text x="28" y="55" fill="#54c6d5" font-size="17" font-weight="700" letter-spacing="2">04 / OPERATIONS</text><text x="28" y="105" fill="#f3f5ef" font-size="29" font-weight="700">Learn &amp; improve</text><text x="28" y="145" fill="#bfced2" font-size="18">Reliability signals</text><text x="28" y="174" fill="#bfced2" font-size="18">Cost stewardship</text></g>
  </g>
  <g filter="url(#glow)"><circle cx="190" cy="390" r="11" fill="#8dd8c5"/><circle cx="450" cy="390" r="11" fill="#8dd8c5"/><circle cx="710" cy="390" r="11" fill="#8dd8c5"/><circle cx="990" cy="390" r="11" fill="#8dd8c5"/></g>
  <text x="75" y="650" fill="#aebfc5" font-family="Arial, sans-serif" font-size="17">Sanitized portfolio model — not a representation of confidential infrastructure.</text>
</svg>
