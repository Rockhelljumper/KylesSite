<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Platform recovery and hardening loop</title>
  <desc id="desc">A circular model connects assess, restore, validate, and strengthen around resilient platform operations.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14212c"/><stop offset="1" stop-color="#193b45"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="750" fill="url(#bg)"/><circle cx="600" cy="415" r="205" fill="none" stroke="#345c68" stroke-width="42"/><circle cx="600" cy="415" r="205" fill="none" stroke="#54c6d5" stroke-dasharray="237 47 237 47 237 47 237 47" stroke-width="10"/>
  <text x="75" y="102" fill="#8dd8c5" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4">RESILIENT PLATFORM RECOVERY</text><text x="75" y="145" fill="#f3f5ef" font-family="Georgia, serif" font-size="42">Recover safely. Learn deliberately.</text>
  <g font-family="Arial, sans-serif"><g transform="translate(512 352)"><circle cx="88" cy="63" r="70" fill="#1d4653" stroke="#8dd8c5" stroke-width="2"/><text x="88" y="55" text-anchor="middle" fill="#f3f5ef" font-size="24" font-weight="700">RESILIENT</text><text x="88" y="85" text-anchor="middle" fill="#c2d2d5" font-size="16">operating loop</text></g><g fill="#173746" stroke="#54c6d5" stroke-width="2"><rect x="480" y="205" width="240" height="90" rx="16"/><rect x="790" y="370" width="240" height="90" rx="16"/><rect x="480" y="535" width="240" height="90" rx="16"/><rect x="170" y="370" width="240" height="90" rx="16"/></g><g fill="#f3f5ef" font-size="25" font-weight="700"><text x="600" y="258" text-anchor="middle">01 / ASSESS</text><text x="910" y="423" text-anchor="middle">02 / RESTORE</text><text x="600" y="588" text-anchor="middle">03 / VALIDATE</text><text x="290" y="423" text-anchor="middle">04 / STRENGTHEN</text></g><g fill="#bcd0d4" font-size="16"><text x="600" y="282" text-anchor="middle">Priorities &amp; owners</text><text x="910" y="447" text-anchor="middle">Controlled baseline</text><text x="600" y="612" text-anchor="middle">Operational handoff</text><text x="290" y="447" text-anchor="middle">Signals &amp; practice</text></g></g>
  <g filter="url(#g)" fill="#8dd8c5"><circle cx="600" cy="295" r="7"/><circle cx="790" cy="415" r="7"/><circle cx="600" cy="535" r="7"/><circle cx="410" cy="415" r="7"/></g><text x="75" y="690" fill="#aebfc5" font-family="Arial, sans-serif" font-size="17">Sanitized portfolio model — no incident, customer, or infrastructure detail is depicted.</text>
</svg>
