name: Portfolio quality

on:
  pull_request:
  push:
    branches: ["feat/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:design
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:visual:evidence
      - run: npm run control-plane:evidence
      - name: Upload design and control-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-governance-evidence
          path: |
            artifacts/design-evidence
            .ai-engineering-output/design-governance
            playwright-report
          if-no-files-found: warn
